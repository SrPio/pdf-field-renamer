<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Field Renamer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-open" class="primary">Open PDF</button>
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
      <span id="file-name" class="file-name">No file</span>

      <div class="group">
        <button id="btn-zoom-out" title="Zoom out (Ctrl -)" disabled>−</button>
        <span id="zoom-label" class="zoom-label">150%</span>
        <button id="btn-zoom-in" title="Zoom in (Ctrl +)" disabled>+</button>
      </div>

      <label class="toggle"><input id="chk-labels" type="checkbox" checked /> Labels</label>
      <label class="toggle"><input id="chk-boxes" type="checkbox" checked /> Boxes</label>

      <span class="spacer"></span>
      <span id="changes" class="changes" hidden></span>
      <button id="btn-csv" disabled>Export CSV</button>
      <button id="btn-json" disabled>Export JSON</button>
      <button id="btn-save" class="primary" title="Ctrl S" disabled>Download PDF</button>
    </header>

    <main class="layout">
      <section id="viewer" class="viewer">
        <div id="empty" class="empty">
          <p><strong>Drop a PDF here</strong> or click “Open PDF”.</p>
          <p class="hint">
            Click a field to select it · double-click to rename it.<br />
            Use dots for hierarchy: <code>parent.child</code>
          </p>
        </div>
        <div id="pages" class="pages"></div>
      </section>

      <aside class="sidebar">
        <div class="editor" id="editor">
          <div class="editor-empty" id="editor-empty">Select a field</div>
          <form id="editor-form" hidden>
            <label for="name-input">Field name</label>
            <input id="name-input" type="text" spellcheck="false" autocomplete="off" />
            <div id="name-error" class="error" hidden></div>
            <dl class="meta">
              <dt>Type</dt><dd id="meta-type"></dd>
              <dt>Page</dt><dd id="meta-page"></dd>
              <dt>Original</dt><dd id="meta-original"></dd>
            </dl>
            <div class="editor-actions">
              <button type="submit" class="primary">Apply</button>
              <button type="button" id="btn-revert">Restore original</button>
            </div>
          </form>
        </div>

        <div class="list-tools">
          <input id="search" type="search" placeholder="Search field…" disabled />
          <select id="sort" title="Sort" disabled>
            <option value="position">Position</option>
            <option value="name">Name</option>
            <option value="document">Document order</option>
          </select>
        </div>
        <div id="list-count" class="list-count"></div>
        <ul id="field-list" class="field-list"></ul>
      </aside>
    </main>

    <div id="drop-overlay" class="drop-overlay" hidden>Drop the PDF to open it</div>
    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
